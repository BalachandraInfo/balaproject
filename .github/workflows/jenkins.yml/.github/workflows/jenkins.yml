name: Trigger Jenkins

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins job
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_JOB: ${{ secrets.JENKINS_JOB }}
          JENKINS_TRIGGER_TOKEN: ${{ secrets.JENKINS_TRIGGER_TOKEN }}
        run: |
          set -eu

          if [ -z "$JENKINS_URL" ] || [ -z "$JENKINS_JOB" ] || [ -z "$JENKINS_TRIGGER_TOKEN" ]; then
            echo "Set JENKINS_URL, JENKINS_JOB, and JENKINS_TRIGGER_TOKEN in the repository's Actions secrets."
            exit 1
          fi

          job_path=$(printf '%s' "$JENKINS_JOB" | sed 's#^/*##; s#/*$##; s#/#/job/#g')
          curl --fail --silent --show-error --request POST \
            "${JENKINS_URL%/}/job/${job_path}/build?token=${JENKINS_TRIGGER_TOKEN}"
